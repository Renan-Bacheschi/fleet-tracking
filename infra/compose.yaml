name: fleet-tracking

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_DB: fleet_tracking
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
    ports:
      - "5432:5432"
    volumes:
      - fleet_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet_tracking"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  fleet_postgres_data:
